<!DOCTYPE html>
<html>
    <head>
        <title>Flate for sale, Mid-levels</title>
    </head>
    <body>
        <header>
            <h1>Completely reasonably priced flat for sale.</h1>
        </header>
        <main>
            <p>Half Bedroom apartment (shared)</p>
            <img src="flat.jpg" alt="Living room with large windows">
            <ul>
                <li>Price: HK$100,000</li>
                <li>Size: 450 sq ft</li>
                <li>District: Mid-Levels</li>
                <li>Bedrooms: 1/2</li>
            </ul>
            <h2>Amenities</h2>
            <ul>
                <li>Gym</li>
                <li>Pool</li>
                <li>MTR somewhere neaby</li>
            </ul>
            <h2>Contact the agent</h2>
            <form>
                <label for="name">Name</label>
                <input type="text" id="name" required>

                <label for="email">Email</label>
                <input type="email" id="email">

                <label for="message">Message</label>
                <textarea id="message"></textarea>

                <button type="submit">Send enquiry</button>
            </form>
        </main>
        <footer>
            <p>Listed by ThaiGer Propertiez</p>
        </footer>
    </body>
</html>
